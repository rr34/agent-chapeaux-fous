[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-v3-node"
version = "0.1.0"
description = "Headless 20x4 Time v3 appliance for Raspberry Pi Zero 2 W"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hardware = ["RPLCD>=1.3", "smbus2>=0.4", "evdev>=1.7"]

[project.scripts]
time-v3-node = "time_v3_node.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

